<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stm32-sim</title>
    <!-- Served by src/ui/server.ts. Only the engine's one npm import needs mapping (decisions.md §15). -->
    <script type="importmap">
      { "imports": { "@gba-kit/debug-info": "/debug-info/index.js" } }
    </script>
    <script src="/wokwi-elements.js"></script>
    <script type="module" src="/src/ui/main.ts"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f9;
        --fg: #1f2328;
        --muted: #59636e;
        --line: #d1d9e0;
        --focus: #0969da;
        --high: #d1242f;
        --low: #0969da;
        --conflict: #bf3989;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1117;
          --fg: #e6edf3;
          --muted: #9198a1;
          --line: #3d444d;
          --focus: #4493f8;
          --high: #ff7b72;
          --low: #4493f8;
          --conflict: #f778ba;
        }
      }
      body {
        margin: 0;
        font:
          15px/1.4 system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 1.5rem;
        align-items: baseline;
        padding: 0.5rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      h1 {
        font-size: 1rem;
        margin: 0;
      }
      header p {
        margin: 0;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      #toolbar {
        display: flex;
        gap: 0.5rem;
        margin-left: auto;
      }
      .layout {
        display: grid;
        grid-template-columns: 1fr minmax(18rem, 30rem);
        height: calc(100vh - 2.6rem);
      }
      main {
        overflow: auto;
        padding: 1rem;
      }
      #panels {
        overflow: auto;
        border-left: 1px solid var(--line);
      }
      #panels:empty {
        display: none;
      }
      .layout:has(#panels:empty) {
        grid-template-columns: 1fr;
      }
      .panel {
        padding: 0.5rem 1rem 1rem;
        border-bottom: 1px solid var(--line);
      }
      .panel h2 {
        font-size: 0.85rem;
        margin: 0 0 0.5rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      @media (max-width: 50rem) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        #panels {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }
      /* Parts sit at their circuit "pos", in CSS px at 96 per inch, zoomed for reading.
         Stacked bottom to top: breadboards, the board, wires, parts (so a part
         under a wire can still be dragged), the board's pins. */
      #circuit {
        position: relative;
        zoom: 1.5;
        isolation: isolate;
      }
      figure[data-type] {
        z-index: 1;
      }
      figure[data-type="breadboard"] {
        z-index: -1;
      }
      /* The palette and Save. */
      .edit {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      #palette {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
      }
      #save {
        margin-left: auto;
      }
      /* A part moves by dragging it. */
      figure[tabindex] {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      /* A part's top-left is its "pos": a pin is at pos plus its pinInfo or art position. */
      figure {
        position: absolute;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
      }
      figure .body {
        position: relative;
        display: flex;
      }
      /* Each pin's target: click one, then another, to wire them. */
      .pin-target {
        position: absolute;
        z-index: 2;
        box-sizing: border-box;
        width: 6px;
        height: 6px;
        margin: -3px 0 0 -3px;
        padding: 0;
        border: 1px solid var(--muted);
        border-radius: 50%;
        background: transparent;
        cursor: crosshair;
      }
      .pin-target:hover,
      .pin-target:focus-visible,
      .pin-target.from {
        background: var(--focus);
        border-color: var(--focus);
      }
      #wires {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        z-index: 0;
      }
      #wires line {
        stroke-linecap: round;
      }
      /* A wider, invisible line to click; none while a wire is being drawn, so pins under wires stay reachable. */
      .wire .hit {
        stroke: transparent;
        stroke-width: 6px;
        pointer-events: stroke;
        cursor: pointer;
      }
      #circuit[data-wiring] .wire .hit {
        pointer-events: none;
      }
      /* Coloured by the net's level, as the board's pins are; floating is dashed. */
      .wire .line {
        stroke: var(--muted);
        stroke-width: 1.5px;
      }
      .wire[data-level="floating"] .line {
        stroke-dasharray: 3 2;
      }
      .wire[data-level="high"] .line {
        stroke: var(--high);
      }
      .wire[data-level="low"] .line {
        stroke: var(--low);
      }
      .wire[data-level="conflict"] .line {
        stroke: var(--conflict);
      }
      /* Selected: focused, by a click or Tab. */
      .wire:focus {
        outline: none;
      }
      .wire:focus .line {
        stroke-width: 3px;
      }
      .wire:focus .hit {
        stroke: color-mix(in srgb, var(--focus) 35%, transparent);
      }
      .band {
        stroke: var(--focus);
        stroke-width: 1.5px;
        stroke-dasharray: 2 2;
        visibility: hidden;
      }
      #circuit[data-wiring] .band {
        visibility: visible;
      }
      figcaption,
      .control {
        font-size: 8px;
        color: var(--muted);
      }
      .control,
      .control label {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .control input {
        width: 70px;
        margin: 0;
      }
      .control output {
        min-width: 3ch;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }
      /* A part with neither a wokwi element nor art yet. */
      .chip {
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 3px;
        padding: 8px 12px;
        font:
          10px ui-monospace,
          monospace;
      }
      :focus-visible,
      wokwi-pushbutton:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 2px;
      }
      /* The Nucleo's header pins, coloured by their net's level. */
      .pin {
        fill: transparent;
      }
      .pin[data-level="high"] {
        fill: var(--high);
      }
      .pin[data-level="low"] {
        fill: var(--low);
      }
      .pin[data-level="conflict"] {
        fill: var(--conflict);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>stm32-sim</h1>
      <p><span id="run" role="status">loading</span></p>
      <p><span id="time">0.000</span> s simulated</p>
      <!-- What the last edit or save did, e.g. "added led1: simulation restarted". -->
      <p><span id="edit" role="status"></span></p>
      <div id="toolbar" role="toolbar" aria-label="Run controls"></div>
    </header>
    <div class="layout">
      <main>
        <div class="edit">
          <div id="palette" role="group" aria-labelledby="palette-label">
            <span id="palette-label">Add a part:</span>
          </div>
          <button id="save" type="button">Save circuit</button>
        </div>
        <section id="circuit" aria-label="Circuit" tabindex="-1"></section>
        <dialog id="confirm" aria-label="Remove a part">
          <form method="dialog">
            <p></p>
            <button value="remove">Remove</button>
            <button value="" autofocus>Cancel</button>
          </form>
        </dialog>
      </main>
      <!-- Panels from src/ui/panels.ts each add a section here. -->
      <aside id="panels" aria-label="Panels"></aside>
    </div>
  </body>
</html>
