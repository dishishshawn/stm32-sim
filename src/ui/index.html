<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>stm32-sim</title>
    <!-- Served by src/ui/server.ts. Only the engine's one npm import needs mapping (decisions.md §15). -->
    <script type="importmap">
      { "imports": { "@gba-kit/debug-info": "/debug-info/index.js" } }

    <script src="/wokwi-elements.js"></script>
    <script type="module" src="/src/ui/main.ts"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --canvas-bg: #edf2f7;
        --fg: #0f172a;
        --muted: #64748b;
        --line: #cbd5e1;
        --border-subtle: #e2e8f0;
        --focus: #2563eb;
        --high: #ef4444;
        --low: #0284c7;
        --conflict: #ec4899;
        --success: #10b981;
        --warning: #f59e0b;
        --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
        --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #090d16;
          --surface: #111827;
          --surface-hover: #1e293b;
          --canvas-bg: #0c111c;
          --fg: #f8fafc;
          --muted: #94a3b8;
          --line: #1e293b;
          --border-subtle: #1e293b;
          --focus: #3b82f6;
          --high: #f87171;
          --low: #38bdf8;
          --conflict: #f472b6;
          --success: #34d399;
          --warning: #fbbf24;
          --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
          --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }

      header {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        align-items: center;
        padding: 0.5rem 1.25rem;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        box-shadow: var(--shadow-sm);
        z-index: 10;
        position: relative;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.45rem;
      }

      .brand-icon {
        font-size: 1.1rem;
        line-height: 1;
      }

      h1 {
        font-size: 0.95rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin: 0;
        color: var(--fg);
      }

      .chip-badge {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: 2px 6px;
        border-radius: 4px;
        background: color-mix(in srgb, var(--focus) 12%, transparent);
        color: var(--focus);
        border: 1px solid color-mix(in srgb, var(--focus) 25%, transparent);
      }

      .status-pill {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        padding: 0.2rem 0.55rem;
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        border-radius: 9999px;
        border: 1px solid var(--border-subtle);
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }

      header:has(#run:empty) .status-dot,
      header #run:not(:empty) {
        /* Status dot reaction */
      }
      .status-pill:has(#run:is([textContent*="running"])) .status-dot {
        background: var(--success);
        box-shadow: 0 0 6px var(--success);
        animation: status-pulse 2s infinite ease-in-out;
      }
      .status-pill:has(#run:is([textContent*="paused"])) .status-dot {
        background: var(--warning);
        box-shadow: 0 0 4px var(--warning);
      }
      .status-pill:has(#run:is([textContent*="fault"], [textContent*="lockup"])) .status-dot {
        background: var(--high);
        box-shadow: 0 0 6px var(--high);
        animation: status-pulse 1s infinite ease-in-out;
      }

      @keyframes status-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.85); }
      }

      header p {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }

      #run {
        font-weight: 600;
        color: var(--fg);
      }

      .timer-display {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.2rem 0.6rem;
        background: color-mix(in srgb, var(--fg) 4%, transparent);
        border-radius: 6px;
        border: 1px solid var(--border-subtle);
        font-family: ui-monospace, "SF Mono", monospace;
        font-size: 12px;
      }

      .timer-icon {
        color: var(--muted);
      }

      #time {
        font-weight: 600;
        color: var(--fg);
      }

      #edit {
        font-size: 12px;
        color: var(--muted);
        font-style: italic;
      }
      #edit:not(:empty) {
        padding: 0.2rem 0.5rem;
        background: color-mix(in srgb, var(--focus) 10%, transparent);
        border: 1px solid color-mix(in srgb, var(--focus) 20%, transparent);
        border-radius: 4px;
        color: var(--focus);
        font-style: normal;
      }

      #toolbar {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin-left: auto;
      }

      #toolbar button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.35rem 0.75rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg);
        font: 13px/1.2 system-ui, sans-serif;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
      }
      #toolbar button:hover:not(:disabled) {
        background: var(--surface-hover);
        border-color: var(--focus);
        color: var(--focus);
      }
      #toolbar button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }

      #toolbar label {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        font-size: 12px;
        color: var(--muted);
        font-weight: 500;
      }
      #toolbar select {
        padding: 0.28rem 0.5rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg);
        font: 12px/1.2 system-ui, sans-serif;
        cursor: pointer;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr minmax(19rem, 30rem);
        height: calc(100vh - 3.25rem);
      }

      main {
        overflow: auto;
        padding: 1.25rem;
        background-color: var(--canvas-bg);
        background-image: radial-gradient(circle, color-mix(in srgb, var(--muted) 30%, transparent) 1.2px, transparent 1.2px);
        background-size: 19.2px 19.2px;
      }

      #panels {
        overflow: auto;
        background: var(--surface);
        border-left: 1px solid var(--line);
        box-shadow: -2px 0 6px rgba(0, 0, 0, 0.02);
      }
      #panels:empty {
        display: none;
      }
      .layout:has(#panels:empty) {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 0.75rem 1.25rem 1.25rem;
        border-bottom: 1px solid var(--line);
      }
      .panel h2 {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0 0 0.65rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      @media (max-width: 50rem) {
        .layout {
          grid-template-columns: 1fr;
          height: auto;
        }
        #panels {
          border-left: 0;
          border-top: 1px solid var(--line);
        }
      }

      /* Parts sit at their circuit "pos", in CSS px at 96 per inch, zoomed for reading. */
      #circuit {
        position: relative;
        zoom: 1.5;
        isolation: isolate;
        min-height: 400px;
      }

      figure[data-type] {
        z-index: 1;
      }
      figure[data-type="breadboard"] {
        z-index: -1;
      }

      /* The palette shelf and Save button. */
      .edit {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 1.25rem;
        padding: 0.5rem 0.85rem;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        box-shadow: var(--shadow-sm);
      }

      #palette {
        display: flex;
        flex-wrap: wrap;
        gap: 0.35rem;
        align-items: center;
      }

      #palette-label {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin-right: 0.25rem;
      }

      #palette button {
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
        padding: 0.3rem 0.6rem;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg);
        font: 12px/1.2 system-ui, sans-serif;
        font-weight: 500;
        cursor: grab;
        transition: all 0.15s ease;
        box-shadow: var(--shadow-sm);
      }
      #palette button:hover {
        background: var(--surface-hover);
        border-color: var(--focus);
        color: var(--focus);
        transform: translateY(-1px);
        box-shadow: var(--shadow-md);
      }
      #palette button:active {
        transform: translateY(0);
      }

      #save {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.85rem;
        border: 1px solid transparent;
        border-radius: 6px;
        background: #10b981;
        color: #ffffff;
        font: 13px/1.2 system-ui, sans-serif;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s ease;
        box-shadow: 0 1px 2px rgba(16, 185, 129, 0.3);
      }
      #save:hover {
        background: #059669;
        box-shadow: 0 2px 5px rgba(16, 185, 129, 0.4);
        transform: translateY(-1px);
      }
      #save:active {
        transform: translateY(0);
      }

      /* Figures and components */
      figure[tabindex] {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }
      figure {
        position: absolute;
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 2px;
        );
        
      }
      figure:hover {
        );
      }
      figure[data-type="breadboard"] {
        );
      }
      figure .body {
        position: relative;
        display: flex;
      }

      /* Gold-plated / precision circular pin terminals */
      .pin-target {
        position: absolute;
        z-index: 2;
        box-sizing: border-box;
        width: 8px;
        height: 8px;
        margin: -4px 0 0 -4px;
        padding: 0;
        border: 1.5px solid color-mix(in srgb, var(--fg) 40%, transparent);
        border-radius: 50%;
        background: color-mix(in srgb, var(--surface) 85%, transparent);
        cursor: crosshair;
        transition: transform 0.12s ease, border-color 0.12s ease, background 0.12s ease;
      }
      .pin-target:hover,
      .pin-target:focus-visible {
        transform: scale(1.4);
        background: var(--focus);
        border-color: #ffffff;
        box-shadow: 0 0 6px var(--focus);
      }
      .pin-target.from {
        transform: scale(1.4);
        background: var(--high);
        border-color: #ffffff;
        box-shadow: 0 0 8px var(--high);
        animation: pulse-pin 1.2s infinite;
      }
      @keyframes pulse-pin {
        0%, 100% { transform: scale(1.3); }
        50% { transform: scale(1.6); }
      }

      /* Realistic Curved Jumper Wires */
      #wires {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
        z-index: 0;
      }
      .wire {
        cursor: pointer;
      }
      .wire .wire-shadow {
        fill: none;
        stroke: rgba(0, 0, 0, 0.14);
        stroke-width: 3.5px;
        stroke-linecap: round;
        stroke-linejoin: round;
        transform: translateY(2px);
        pointer-events: none;
      }
      .wire .hit {
        fill: none;
        stroke: transparent;
        stroke-width: 8px;
        stroke-linecap: round;
        stroke-linejoin: round;
        pointer-events: stroke;
        cursor: pointer;
      }
      #circuit[data-wiring] .wire .hit {
        pointer-events: none;
      }
      .wire .line {
        fill: none;
        stroke: var(--wire-color, var(--muted));
        stroke-width: 2.8px;
        stroke-linecap: round;
        stroke-linejoin: round;
        transition: stroke 0.15s ease, stroke-width 0.15s ease, filter 0.15s ease;
      }
      .wire .wire-cap {
        fill: var(--wire-color, var(--muted));
        stroke: rgba(0, 0, 0, 0.35);
        stroke-width: 0.8px;
        pointer-events: none;
      }
      .wire[data-level="floating"] .line {
        stroke-dasharray: 4 3;
        opacity: 0.85;
      }
      .wire[data-level="high"] .line {
        stroke: var(--high);
         75%, transparent));
      }
      .wire[data-level="high"] .wire-cap {
        fill: var(--high);
      }
      .wire[data-level="low"] .line {
        stroke: var(--low);
         75%, transparent));
      }
      .wire[data-level="low"] .wire-cap {
        fill: var(--low);
      }
      .wire[data-level="conflict"] .line {
        stroke: var(--conflict);
        );
      }
      .wire[data-level="conflict"] .wire-cap {
        fill: var(--conflict);
      }
      .wire:hover .line {
        stroke-width: 4px;
        );
      }
      .wire:focus {
        outline: none;
      }
      .wire:focus .line {
        stroke-width: 4.5px;
        stroke: var(--focus) !important;
        );
      }
      .wire:focus .wire-cap {
        fill: var(--focus) !important;
      }

      .band {
        fill: none;
        stroke: var(--focus);
        stroke-width: 2.5px;
        stroke-linecap: round;
        stroke-dasharray: 4 3;
        visibility: hidden;
        );
      }
      #circuit[data-wiring] .band {
        visibility: visible;
      }

      figcaption,
      .control {
        font-size: 9px;
        font-family: ui-monospace, "SF Mono", monospace;
        color: var(--muted);
      }
      figcaption {
        font-weight: 600;
        background: color-mix(in srgb, var(--surface) 80%, transparent);
        padding: 1px 4px;
        border-radius: 3px;
      }

      .control,
      .control label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .control input {
        width: 70px;
        margin: 0;
      }
      .control output {
        min-width: 3ch;
        color: var(--fg);
        font-variant-numeric: tabular-nums;
      }

      .chip {
        box-sizing: border-box;
        border: 1px solid var(--line);
        border-radius: 4px;
        background: var(--surface);
        padding: 8px 12px;
        font: 11px ui-monospace, monospace;
        box-shadow: var(--shadow-sm);
      }

      :focus-visible,
      wokwi-pushbutton:focus-within {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      /* Nucleo header pins coloured by net level */
      .pin {
        fill: transparent;
        transition: fill 0.15s ease;
      }
      .pin[data-level="high"] {
        fill: var(--high);
        );
      }
      .pin[data-level="low"] {
        fill: var(--low);
        );
      }
      .pin[data-level="conflict"] {
        fill: var(--conflict);
        );
      }

      </style>
  </head>
  <body>
    <header>
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <h1>stm32-sim</h1>
        <span class="chip-badge">NUCLEO-G031K8</span>
      </div>
      <div class="status-pill">
        <span class="status-dot"></span>
        <p><span id="run" role="status">loading</span></p>
      </div>
      <div class="timer-display">
        <span class="timer-icon">⏱</span>
        <p><span id="time">0.000</span> s simulated</p>
      </div>
      <p><span id="edit" role="status"></span></p>
      <div id="toolbar" role="toolbar" aria-label="Run controls"></div>
    </header>
    <div class="layout">
      <main>
        <div class="edit">
          <div id="palette" role="group" aria-labelledby="palette-label">
            <span id="palette-label">Add a part:</span>
          </div>
          <button id="save" type="button">Save circuit</button>
        </div>
        <section id="circuit" aria-label="Circuit" tabindex="-1"></section>
        <dialog id="confirm" aria-label="Remove a part">
          <form method="dialog">
            <p></p>
            <button value="remove">Remove</button>
            <button value="" autofocus>Cancel</button>
          </form>
        </dialog>
      </main>
      <!-- Panels from src/ui/panels.ts each add a section here. -->
      <aside id="panels" aria-label="Panels"></aside>
    </div>
  </body>
</html>
