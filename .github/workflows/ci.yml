name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    # A normal run takes about 2 minutes. Without a limit, a hung apt mirror holds
    # a runner (and private-repo Actions minutes) for GitHub's 6-hour default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # installs node and just from .mise.toml
      # libnewlib-arm-none-eabi is only a Recommends of gcc-arm-none-eabi; name it so the build never depends on apt's defaults
      - run: sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update && sudo apt-get -o Acquire::Retries=3 install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
        timeout-minutes: 8
      # Chromium's headless shell for the UI tests (src/ui/ui.test.ts), which
      # `just setup` installs: a 120 MB download, cached until package-lock.json
      # (playwright-core's version) changes.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # The README's quickstart, as a learner runs it from a fresh clone, so it
      # can't silently rot. `just demo` serves until Ctrl-C, so CI runs its
      # non-interactive check instead: `just fw`, then `sim run` on the thermometer.
      - run: just setup
        timeout-minutes: 5
      - run: just fw
      - run: just sim run build/thermometer.elf --circuit firmware/thermometer/circuit.json --for 1s
      - run: just typecheck
      - run: just test
