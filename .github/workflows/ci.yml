name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5 # installs node and just from .mise.toml
      # libnewlib-arm-none-eabi is only a Recommends of gcc-arm-none-eabi; name it so the build never depends on apt's defaults
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi
      - run: npm ci
      - run: just typecheck
      - run: just fw
      - run: just test
